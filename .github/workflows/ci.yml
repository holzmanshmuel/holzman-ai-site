name: ci

# HOLZMAN-312: /for-agents says "Everything here is current as of <date>".
# This job fails a pull request that changes the page without moving that date
# (and keeps the page, its JSON-LD and the sitemap on the same date), so the
# date stays true without anyone having to remember it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  for-agents-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests for the date check
        run: python3 -I tests/test_for_agents_date.py
      - name: Date check against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python3 -I scripts/for_agents_date.py check --base "$BASE_SHA"
          else
            python3 -I scripts/for_agents_date.py check
          fi
